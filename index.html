<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="VetCare - Inicio de sesión del sistema de gestión de la Clínica Veterinaria Huellitas.">
  <title>Iniciar sesión | VetCare - Clínica Huellitas</title>
  <link rel="preload" href="css/normalize.css" as="style">
  <link rel="preload" href="css/styles.css" as="style">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/customErick.css">
</head>

<body class="d-flex flex-column">


  <header class="portal-header">
    <div class="d-flex items-center gap-3 mw-content mx-auto">
      <span class="brand-mark logo d-flex items-md-center justify-center " aria-hidden="true">VC</span>
      <hgroup>
        <p class="font-display fs-lg fw-extrabold text-white lh-tight">VetCare</p>
        <p class="fs-xs text-nav-muted">Clínica Veterinaria Huellitas &middot; Quito, Ecuador</p>
      </hgroup>
    </div>
  </header>

  <main id="main-content" class="portal-main">
    <header class="text-center mb-6">
      <h1 class="mb-2">Bienvenido</h1>
      <p class="fs-sm text-muted">Ingrese sus credenciales para acceder al sistema de gestión de la clínica.</p>
    </header>

    <section class="card shadow-md" aria-labelledby="login-title">
      <header class="card-header">
        <h2 id="login-title" class="card-title">Iniciar sesión</h2>
      </header>

      <form action="pages/recepcionista/recepcionista-dashboard.html" method="get" class="card-body">
        <div class="form-group">
          <label for="login-email" class="form-label required">Correo electrónico</label>
          <input type="email" id="login-email" name="email" class="form-control" required autocomplete="username"
            placeholder="usuario@vetcare.com">
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label required">Contraseña</label>
          <input type="password" id="login-password" name="password" class="form-control" required minlength="6"
            autocomplete="current-password">
          <p class="form-hint">Mínimo 6 caracteres.</p>
        </div>

        <div class="form-check mb-4">
          <input type="checkbox" id="remember-me" name="remember" class="form-check-input">
          <label for="remember-me" class="form-check-label">Recordar sesión en este equipo</label>
        </div>

        <fieldset class="border-0 p-0">
          <legend class="form-label mb-2">Ingresar como</legend>
          <div class="d-flex flex-column gap-2">
            <button type="submit" class="btn btn-primary btn-block"
              formaction="pages/recepcionista/recepcionista-dashboard.html">
              Recepcionista
            </button>
            <button type="submit" class="btn btn-secondary btn-block"
              formaction="pages/veterinario/citas/consultar-citas.html">
              Médico veterinario
            </button>
            <button type="submit" class="btn btn-outline btn-block"
              formaction="pages/administrador/admin-dashboard.html">
              Administrador
            </button>
          </div>
        </fieldset>
      </form>
    </section>
  </main>

  <footer class="portal-footer">
    <p>&copy; 2026 Clínica Veterinaria Huellitas &middot; VetCare &middot; Quito, Ecuador</p>
  </footer>
</body>

</html>
